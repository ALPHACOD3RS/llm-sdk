name: release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # @changesets/cli requires Node >=22.11 — this is the tooling runtime for
          # this job, unrelated to the SDK's own `engines.node: ">=18"` promise to consumers.
          node-version: "22"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Two outcomes, depending on whether unreleased changesets exist on main:
      #   - Pending changesets: opens/updates a "Version Packages" PR that bumps
      #     package.json + CHANGELOG.md. Nothing is published yet.
      #   - No pending changesets (i.e. that PR was just merged): runs
      #     `npm run release`, which publishes the already-bumped version to npm
      #     under the `latest` tag and pushes a matching git tag.
      - name: Version or publish
        uses: changesets/action@v1
        with:
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
